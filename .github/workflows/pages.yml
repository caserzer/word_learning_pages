name: Publish frontend Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frontend modules
        run: |
          node --check app.js
          node --check learning.js
          node --check sync.js
          node --check review.js
          node --check review-ui.js
          node --check review-content.js
          node --check config.js
      - name: Stage explicit public files only
        run: |
          mkdir _site
          cp index.html styles.css app.js config.js learning.js sync.js review.js review-ui.js review-content.js .nojekyll _site/
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, existsSync } from 'node:fs';
          for (const file of readdirSync('_site').filter(x => x.endsWith('.js'))) {
            for (const match of readFileSync('_site/' + file, 'utf8').matchAll(/(?:from\s*|import\s*)['"]\.\/([^'"]+)['"]/g)) {
              const dependency = match[1].split('?')[0];
              if (!existsSync('_site/' + dependency)) throw Error(file + ' imports missing public module ' + dependency);
            }
          }
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live app bootstrap in isolated Chromium
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          timeout 45 google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-sync --no-first-run --user-data-dir="$(mktemp -d)" --virtual-time-budget=10000 --dump-dom "$PAGE_URL" > /tmp/word-learning-public-dom.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const dom = readFileSync('/tmp/word-learning-public-dom.html', 'utf8');
          assert.ok(dom.includes('记录已保存在本机；填写同步口令后自动合并旧记录。'), 'App modules must execute and show the local-only sync state');
          assert.ok(dom.includes('id="sync-key"') && dom.includes('id="cloud-sync"'), 'Sync setup panel must be present');
          assert.ok(dom.includes('今日练习 0 个义项 · 0 次练习'), 'Learning home must initialize in the fresh browser');
          console.log('Live Chromium app bootstrap and cloud setup panel passed with empty isolated browser storage.');
          NODE
      - name: Verify live sync rejects unauthenticated access
        run: |
          node --input-type=module <<'NODE'
          for (const method of ['GET', 'PUT']) {
            const response = await fetch('https://word-learning-api.caserzer.workers.dev/api/sync', { method, redirect: 'error', signal: AbortSignal.timeout(20000) });
            await response.body?.cancel();
            if (![401, 503].includes(response.status) || response.headers.get('Cache-Control') !== 'no-store') throw Error('Private sync must fail closed: ' + method + ' status ' + response.status);
            console.log('Unauthenticated ' + method + ' /api/sync safely rejected (' + response.status + ')');
          }
          NODE
      - name: Verify exact live asset bytes and Worker health
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const files=['index.html','styles.css','app.js','config.js','learning.js','sync.js','review.js','review-ui.js','review-content.js'];
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          for(const file of files){
            const expected=digest(readFileSync(file));let matched=false;
            for(let attempt=0;attempt<24&&!matched;attempt++){
              const response=await fetch(new URL(file+'?release='+process.env.GITHUB_SHA,process.env.PAGE_URL),{signal:AbortSignal.timeout(20000)});
              matched=response.ok&&digest(Buffer.from(await response.arrayBuffer()))===expected;
              if(!matched)await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!matched)throw Error('Live asset mismatch: '+file);
            console.log('Exact live bytes matched: '+file+' '+expected);
          }
          for(const path of ['/health','/ready']){
            const response=await fetch('https://word-learning-api.caserzer.workers.dev'+path,{signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error(path+' '+response.status);
            console.log(path+' '+response.status);
          }
          NODE
