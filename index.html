<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一点点 · 单词学习</title><link rel="stylesheet" href="./styles.css"></head><body><main>
<header><p class="eyebrow">WORD LEARNING / DEMO</p><h1>今天的单词，一点点记住</h1><p>看见英文，想起意思。每三个词，停下来回顾一下。</p></header>
<p id="status" role="status">正在连接词库…</p>
<p id="storage-warning" role="alert" hidden>浏览器保存失败，请导出备份，避免丢失进度。</p>
<section><h2>01 · 找到今天的词</h2><form id="search"><label for="query">输入单词、词组或中文</label><div class="row"><input id="query" maxlength="100" required placeholder="例如 apple / a couple of"><button>查找</button></div></form><p class="muted">词库：上海2020评价指南历史快照；自动提取的词义请与课本核对。搜索不会自动修改你的输入。</p><div id="results" aria-live="polite"></div></section>
<section><h2>02 · 我的学习清单</h2><p id="count"></p><div class="row"><button id="today">今天全部复习</button><button id="due">到期复习</button><button id="export" class="secondary">导出备份</button></div><p class="muted">记录仅保存在本浏览器，不上传孩子的学习信息。换设备或清理浏览器前请导出；登录同步将在后续实现。</p><ul id="queue"></ul></section>
<section id="review" hidden><h2>03 · 先想，再揭晓</h2><p id="review-count"></p><h3 id="prompt"></h3><button id="reveal">揭晓意思</button><p id="answer" hidden></p><div id="ratings" class="row" hidden><button data-rating="remember">记得</button><button data-rating="uncertain">模糊，再试</button><button data-rating="forgot">忘记，再试</button></div><p class="muted">这是自我回顾，不是掌握测验。模糊或忘记的词会在本轮结束后再练一次。</p><button id="close" class="secondary">结束这次回顾</button></section>
<footer>Demo · 无广告 · 不需要填写姓名 <a href="https://github.com/caserzer/word_learning">项目说明</a></footer>
</main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
